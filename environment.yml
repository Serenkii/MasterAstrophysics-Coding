
    
  
name: physics
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python>=3.11,<3.14
  - pip

  # Numerical computing
  - numpy
  - scipy
  - mpmath

  # Plotting and visualization
  - matplotlib
  - seaborn
  - plotly

  # Symbolic mathematics
  - sympy

  # Data analysis
  - pandas
  - xarray

  # Jupyter and interactive work
  - jupyterlab
  - notebook
  - ipython
  - ipykernel

  # Physics and scientific utilities
  - astropy
  - uncertainties
  - lmfit
  - h5py

  # Optimization, statistics, and machine learning
  - scikit-learn
  - statsmodels

  # Useful developer / workflow tools
  - tqdm
  - numba
  - joblib

